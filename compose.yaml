services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yolo_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=yolov8n.pt
      - ALLOWED_ORIGIN=*
    volumes:
      - yolo_model_cache:/root/.cache/ultralytics
      - ./backend/yolov8n.pt:/app/yolov8n.pt
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yolo_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  yolo_model_cache:
