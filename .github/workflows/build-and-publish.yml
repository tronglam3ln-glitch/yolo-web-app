name: Build and Publish Backend

# Trigger: chỉ chạy khi code THỰC SỰ được merge vào main (push trực tiếp lên main
# chỉ xảy ra qua merge PR, vì nhánh main đã được bảo vệ / branch protection).
# Thêm trigger theo git tag dạng v1.0.0 để hỗ trợ release thủ công (yêu cầu tuỳ chọn #7).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Cấp quyền cho GITHUB_TOKEN (secret có sẵn của GitHub, không cần tự tạo)
# được phép ghi (push) image lên GitHub Container Registry.
permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx là engine build nâng cao của Docker, bắt buộc phải có để dùng được
      # tính năng cache-from/cache-to kiểu "gha" bên dưới.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào GHCR bằng chính GITHUB_TOKEN được cấp tự động cho workflow,
      # không phải secret do em tự tạo. github.actor = tên user/bot đang chạy workflow.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tự động sinh ra danh sách tag cho image dựa trên ngữ cảnh (nhánh, sha, git tag).
      # Kết quả ví dụ: ghcr.io/<owner>/yolo-backend:latest
      #               ghcr.io/<owner>/yolo-backend:sha-a1b2c3d
      #               ghcr.io/<owner>/yolo-backend:v1.0.0  (nếu push git tag)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yolo-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      # Build image từ backend/Dockerfile, dùng cache layer lưu trên GitHub Actions
      # (type=gha) để lần build sau tận dụng lại layer chưa đổi, và push thẳng lên GHCR.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yolo-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
