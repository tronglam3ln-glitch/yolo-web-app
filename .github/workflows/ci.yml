name: Backend CI

# Trigger: chỉ chạy khi có Pull Request nhắm vào nhánh main
on:
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Cài dependency + chạy pytest cho backend
  # ============================================================
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # opencv-python-headless và xử lý video vẫn cần các thư viện hệ thống này,
      # giống hệt phần RUN apt-get trong Dockerfile của em
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check backend/

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  docker-build-backend:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t yolo-backend:ci .


  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Run build (structural test)
        working-directory: frontend
        run: npm run build

  docker-build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t yolo-frontend:ci frontend/
